# Compact inline search UI (fzf-like) instead of full screen.
style = "compact"
inline_height = 20

# Show a preview of the selected command.
show_preview = true

# Theme name. atuin does NOT honour the ATUIN_THEME__NAME env override, so
# atuin/theme.fish rewrites this line in place on light/dark switches.
[theme]
name = "catppuccin-mocha-mauve"
