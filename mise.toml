# =============================================================================
# mise.toml — single declarative source of truth for this machine.
#
# `mise bootstrap` (run from ~/.dotfiles) provisions macOS and Ubuntu/Debian
# from this one file. It is ALSO the global mise config: the adoption step
# symlinks ~/.config/mise/config.toml -> ~/.dotfiles/mise.toml so [tools] and
# [env] are active machine-wide (see tasks/adopt-global-config.fish).
#
# Layering:
#   this file (tracked)                -> everything shared across machines
#   ~/.config/mise/config.local.toml   -> UNTRACKED machine/work-specific tools
#                                         (loaded globally by mise; e.g. go pin,
#                                          bazel, ktlint, swiftformat, ...)
#
# Prefer a cross-platform [tools] declaration over duplicate brew:/apt: installs
# whenever the resulting binary/behaviour is equivalent. Host package managers
# are used for OS libraries, build deps, GUI apps and OS-coupled software only.
# =============================================================================

[settings]
# Ruby: use precompiled binaries instead of compiling from source.
ruby.compile = false

# =============================================================================
# [env] — shell-independent environment (active everywhere via the global config)
# =============================================================================
[env]
EDITOR = "nvim"
VISUAL = "nvim"
WEDITOR = "nvim"
DOTFILES = "{{env.HOME}}/.dotfiles"
PROJECTS = "{{env.HOME}}/Developer"
GOPATH = "{{env.HOME}}/Developer/Go"
LC_CTYPE = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"
# PATH additions (was 00-dotfiles/install.fish fish_add_path + golang fish_user_paths).
# ~/.local/bin is handled in 02-fish/config.fish; ~/.cargo/bin is dropped (cargo
# tools are now mise-managed and shimmed).
_.path = [
    "{{env.HOME}}/.dotfiles/bin",
    "{{env.HOME}}/.bin",
    "{{env.HOME}}/Developer/Go/bin",
]

# =============================================================================
# [tools] — portable runtimes + cross-platform CLIs (shared macOS + Ubuntu).
# Everything here replaces the old per-component `mise install`/`mise use` scripts
# AND the macOS brew CLIs / Ubuntu manual GitHub-release downloads they duplicated.
# =============================================================================
[tools]

# --- language runtimes -------------------------------------------------------
node = "latest"
python = "latest"
ruby = "latest"
rust = "latest"
lua = "latest"
# NOTE: `go` is intentionally NOT here — it was never declared by the dotfiles.
# Its pin lives in the untracked ~/.config/mise/config.local.toml.

# --- cross-platform developer CLIs (aqua backend; x86_64 + arm64) ------------
# Converged from macOS brew + Ubuntu manual GitHub-release installers.
neovim = "latest"
delta = "latest"        # git-delta; provides the `delta` binary
eza = "latest"
dust = "latest"
lazygit = "latest"
lazydocker = "latest"
k9s = "latest"
kubectx = "latest"
kubens = "latest"
zellij = "latest"
shfmt = "latest"
prek = "latest"
atuin = "latest"
tealdeer = "latest"     # provides `tldr`
starship = "latest"
fd = "latest"
bat = "latest"
ripgrep = "latest"      # provides `rg`
fzf = "latest"
gh = "latest"           # removes the Ubuntu GitHub-CLI apt repo entirely
gum = "latest"
jq = "latest"
yazi = "latest"
gping = "latest"

# --- Node CLIs (was: npm install --global from npm_packages.txt) --------------
"npm:cspell" = "latest"
"npm:eslint" = "latest"
"npm:eslint_d" = "latest"
"npm:fixjson" = "latest"
"npm:jsonlint" = "latest"
"npm:prettier" = "latest"
"npm:neovim" = "latest"        # Neovim Node provider — kept on PATH for nvim

# --- Python CLIs (was: pip install from python_pip.txt) ----------------------
# Standalone apps only. Libraries (PyYAML/termcolor/tomli) are NOT pipx apps;
# they live in the mise-managed python and are imported by scripts/plugins.
"pipx:black" = "latest"
"pipx:yamllint" = "latest"
"pipx:pynvim" = "latest"       # Neovim Python provider

# --- Ruby CLIs (was: gem install from ruby_gems.txt) -------------------------
"gem:bundler" = "latest"
"gem:solargraph" = "latest"
"gem:neovim" = "latest"        # Neovim Ruby provider

# --- Rust CLIs (was: cargo install --locked in rust/install.fish) ------------
"cargo:cargo-update" = { version = "latest", depends = ["rust"] }
"cargo:stylua" = { version = "latest", depends = ["rust"] }
"cargo:cargo-nextest" = { version = "latest", depends = ["rust"] }

# =============================================================================
# [bootstrap.packages] — host packages ONLY (OS libraries, build deps, GUI apps,
# OS-coupled software, and tools with no suitable mise backend). Never duplicate
# something already in [tools].
# =============================================================================
[bootstrap.packages]

