# ---------- Ubuntu/Debian: apt (os = "linux") --------------------------------
# Host packages only. bat/fd/fzf/ripgrep/gh moved to [tools], so the old
# batcat/fdfind compatibility symlinks and the GitHub-CLI apt repo are gone.
"apt:fish" = { os = "linux" }
"apt:git" = { os = "linux" }
"apt:git-lfs" = { os = "linux" }
"apt:cmake" = { os = "linux" }
"apt:gcc" = { os = "linux" }
"apt:clang-format" = { os = "linux" }
"apt:ffmpeg" = { os = "linux" }
"apt:sox" = { os = "linux" }
"apt:chafa" = { os = "linux" }
"apt:webp" = { os = "linux" }
"apt:aria2" = { os = "linux" }
"apt:httpie" = { os = "linux" }
"apt:wget" = { os = "linux" }
"apt:tmux" = { os = "linux" }
"apt:unzip" = { os = "linux" }
"apt:btop" = { os = "linux" }
"apt:shellcheck" = { os = "linux" }
"apt:xclip" = { os = "linux" }            # Neovim clipboard provider on Linux
"apt:python3-virtualenv" = { os = "linux" }

# =============================================================================
# [dotfiles] — symlink management (replaces script/bootstrap.fish link_file and
# 00-dotfiles/install.fish). Sources use ~/.dotfiles/... so they resolve to the
# real repo regardless of how the config is loaded (project or global symlink).
#
# fish conf.d/functions use `symlink-each` (per-file) so fisher-generated files
# in those dirs are never clobbered. atuin/zellij/starship are NOT here — their
# theme scripts rewrite the files, so they are seeded as real files by
# tasks/seed-configs.fish.
# =============================================================================
[dotfiles]

# --- fish: per-file so fisher-managed files coexist --------------------------
"~/.config/fish/conf.d" = { source = "~/.dotfiles/02-fish/conf.d", mode = "symlink-each" }
"~/.config/fish/functions" = { source = "~/.dotfiles/02-fish/functions", mode = "symlink-each" }
"~/.config/fish/config.fish" = { source = "~/.dotfiles/02-fish/config.fish", mode = "symlink" }

# component conf.d/functions (each component owns its snippets) --------------
"~/.config/fish/conf.d/atuin.fish" = { source = "~/.dotfiles/atuin/conf.d/atuin.fish", mode = "symlink" }
"~/.config/fish/conf.d/bat_abbr.fish" = { source = "~/.dotfiles/bat/conf.d/bat_abbr.fish", mode = "symlink" }
"~/.config/fish/conf.d/docker_abbr.fish" = { source = "~/.dotfiles/docker/conf.d/docker_abbr.fish", mode = "symlink" }
"~/.config/fish/conf.d/dog_abbr.fish" = { source = "~/.dotfiles/dog/conf.d/dog_abbr.fish", mode = "symlink" }
"~/.config/fish/conf.d/dust_abbr.fish" = { source = "~/.dotfiles/dust/conf.d/dust_abbr.fish", mode = "symlink" }
"~/.config/fish/conf.d/eza_abbr.fish" = { source = "~/.dotfiles/eza/conf.d/eza_abbr.fish", mode = "symlink" }
"~/.config/fish/conf.d/fd_abbr.fish" = { source = "~/.dotfiles/fd/conf.d/fd_abbr.fish", mode = "symlink" }
"~/.config/fish/conf.d/fzf_theme.fish" = { source = "~/.dotfiles/fzf/conf.d/fzf_theme.fish", mode = "symlink" }
"~/.config/fish/conf.d/git_abbr.fish" = { source = "~/.dotfiles/git/conf.d/git_abbr.fish", mode = "symlink" }
"~/.config/fish/conf.d/gping_abbr.fish" = { source = "~/.dotfiles/gping/conf.d/gping_abbr.fish", mode = "symlink" }
"~/.config/fish/conf.d/mise.fish" = { source = "~/.dotfiles/mise/conf.d/mise.fish", mode = "symlink" }
"~/.config/fish/conf.d/nvim_abbr.fish" = { source = "~/.dotfiles/nvim/conf.d/nvim_abbr.fish", mode = "symlink" }
"~/.config/fish/conf.d/install.fish" = { source = "~/.dotfiles/pnpm/conf.d/install.fish", mode = "symlink" }
"~/.config/fish/conf.d/ripgrep.fish" = { source = "~/.dotfiles/ripgrep/conf.d/ripgrep.fish", mode = "symlink" }
"~/.config/fish/conf.d/rustnet_abbr.fish" = { source = "~/.dotfiles/rustnet/conf.d/rustnet_abbr.fish", mode = "symlink" }
"~/.config/fish/conf.d/set-locale.fish" = { source = "~/.dotfiles/system/conf.d/set-locale.fish", mode = "symlink" }
"~/.config/fish/conf.d/starship.fish" = { source = "~/.dotfiles/starship/conf.d/starship.fish", mode = "symlink" }
"~/.config/fish/conf.d/system_abbr.fish" = { source = "~/.dotfiles/system/conf.d/system_abbr.fish", mode = "symlink" }
"~/.config/fish/conf.d/tealdeer.fish" = { source = "~/.dotfiles/tealdeer/conf.d/tealdeer.fish", mode = "symlink" }
"~/.config/fish/conf.d/zoxide.fish" = { source = "~/.dotfiles/zoxide/conf.d/zoxide.fish", mode = "symlink" }
# macOS-only fish snippets
"~/.config/fish/conf.d/macos_abbr.fish" = { source = "~/.dotfiles/macos/conf.d/macos_abbr.fish", mode = "symlink", os = "macos" }
"~/.config/fish/conf.d/macos_path.fish" = { source = "~/.dotfiles/macos/conf.d/macos_path.fish", mode = "symlink", os = "macos" }
"~/.config/fish/conf.d/mitm_abbr.fish" = { source = "~/.dotfiles/mitmproxy/conf.d/mitm_abbr.fish", mode = "symlink", os = "macos" }
"~/.config/fish/conf.d/xcode_abbr.fish" = { source = "~/.dotfiles/xcode/conf.d/xcode_abbr.fish", mode = "symlink", os = "macos" }

# --- whole application config dirs (safe to symlink; theme = env vars) --------
"~/.config/nvim" = { source = "~/.dotfiles/nvim/config", mode = "symlink" }
"~/.config/bat" = { source = "~/.dotfiles/bat/config", mode = "symlink" }
"~/.config/btop" = { source = "~/.dotfiles/btop/config", mode = "symlink" }
"~/.config/k9s" = { source = "~/.dotfiles/k9s/config", mode = "symlink" }
"~/.config/yazi" = { source = "~/.dotfiles/yazi/config", mode = "symlink" }
"~/.config/gitui" = { source = "~/.dotfiles/gitui/config", mode = "symlink" }
"~/.config/gh-dash" = { source = "~/.dotfiles/gh-dash/config", mode = "symlink" }
"~/.config/tealdeer" = { source = "~/.dotfiles/tealdeer/config", mode = "symlink" }
"~/.config/ghostty" = { source = "~/.dotfiles/ghostty/config", mode = "symlink" }
"~/.config/zed" = { source = "~/.dotfiles/zed/config", mode = "symlink-each" }

# --- macOS-only application config -------------------------------------------
"~/.config/kitty" = { source = "~/.dotfiles/kitty/config", mode = "symlink", os = "macos" }
"~/.mitmproxy" = { source = "~/.dotfiles/mitmproxy/config", mode = "symlink", os = "macos" }
"~/Library/Application Support/com.mitchellh.ghostty/config" = { source = "~/.dotfiles/ghostty/config/config", mode = "symlink", os = "macos" }

# --- home dotfiles -----------------------------------------------------------
"~/.gitignore" = { source = "~/.dotfiles/git/gitignore.symlink", mode = "symlink" }
"~/.editorconfig" = { source = "~/.dotfiles/editorconfig/editorconfig.symlink", mode = "symlink" }
"~/.ssh/config.dotfiles" = { source = "~/.dotfiles/ssh/config.dotfiles", mode = "symlink" }

# =============================================================================
# [bootstrap.macos.defaults] — macOS system preferences (os-gated automatically).
# Obsolete / no-op / security-reducing tweaks from the old set-defaults.sh were
# deliberately dropped (see tasks/macos-extras.fish header and README).
# AppleInterfaceStyle is intentionally NOT forced — the theme system observes the
# system appearance; forcing Dark would fight automatic light/dark switching.
# =============================================================================
[bootstrap.macos.defaults.NSGlobalDomain]
# Keyboard
ApplePressAndHoldEnabled = false
KeyRepeat = 2
InitialKeyRepeat = 15
NSAutomaticQuoteSubstitutionEnabled = false
NSAutomaticDashSubstitutionEnabled = false
NSAutomaticSpellingCorrectionEnabled = false
WebAutomaticTextReplacementEnabled = true
# Trackpad / mouse
"com.apple.trackpad.scaling" = 2.0
"com.apple.mouse.scaling" = 2.5
# UI
AppleShowScrollBars = "Always"
NSWindowResizeTime = 0.001

[bootstrap.macos.defaults."com.apple.screensaver"]
askForPassword = 1
askForPasswordDelay = 0

[bootstrap.macos.defaults."com.apple.NetworkBrowser"]
BrowseAllInterfaces = 1

[bootstrap.macos.defaults."com.apple.menuextra.battery"]
ShowPercent = true

[bootstrap.macos.defaults."com.apple.dock"]
mru-spaces = false
tilesize = 45
expose-animation-duration = 0.1
expose-group-by-app = true
autohide-delay = 0.0
autohide-time-modifier = 0.0
autohide = true
launchanim = false

[bootstrap.macos.defaults."com.apple.finder"]
FXPreferredViewStyle = "Nlsv"
ShowExternalHardDrivesOnDesktop = true
ShowRemovableMediaOnDesktop = true
NSNavPanelExpandedStateForSaveMode = true
NSTableViewDefaultSizeMode = 1
ShowStatusBar = true
ShowPathbar = true
WarnOnEmptyTrash = false
NSDocumentSaveNewDocumentsToCloud = false
_FXShowPosixPathInTitle = true
FXEnableExtensionChangeWarning = false

[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true

# Web dev toggle. NOTE: Safari is sandboxed — its prefs live in
# ~/Library/Containers and can't be written via `defaults` without Full Disk
# Access (and doing so aborts bootstrap), so Safari defaults are intentionally
# omitted. Chrome's domain is a normal plist and writes fine.
[bootstrap.macos.defaults."com.google.Chrome"]
AppleEnableSwipeNavigateWithScrolls = false

# =============================================================================
# [tasks] — imperative EXCEPTIONS only. The special `bootstrap` task runs on every
# `mise bootstrap`; each sub-task is idempotent. Everything here is something mise
# cannot express declaratively.
# =============================================================================
[tasks.fisher]
description = "Install fisher (if absent) and converge 03-fisher/plugins"
run = "fish $DOTFILES/tasks/fisher.fish"

[tasks.git-local]
description = "Ensure ~/.gitconfig include + identity (prompt only if missing); gh settings"
run = "fish $DOTFILES/tasks/git-local.fish"

[tasks.ssh-setup]
description = "Ensure ~/.ssh/config includes config.dotfiles; fix permissions"
run = "fish $DOTFILES/tasks/ssh-setup.fish"

[tasks.seed-configs]
description = "Seed atuin/zellij/starship real-file configs + rebuild bat cache + apply theme"
run = "fish $DOTFILES/tasks/seed-configs.fish"

[tasks.os-extras]
description = "OS-specific setup: macOS defaults side-effects + dark-notify; Ubuntu fonts"
run = "fish $DOTFILES/tasks/os-extras.fish"

[tasks.login-shell]
description = "Add fish to /etc/shells and set it as the login shell (skipped in CI)"
run = "fish $DOTFILES/tasks/login-shell.fish"

[tasks.bootstrap]
description = "Idempotent post-provision exceptions"
depends = ["fisher", "git-local", "ssh-setup", "seed-configs", "os-extras", "login-shell"]
