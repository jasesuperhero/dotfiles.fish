# vim:fileencoding=utf-8:ft=kitty

# fonts
# NFM (Mono) variant forces all Nerd Font symbols to single-cell width
font_family                     JetBrainsMono NF
italic_font                     JetBrainsMono NF Italic
bold_font                       JetBrainsMono NF Bold
bold_italic_font                JetBrainsMono NF Bold Italic

symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

font_size                       16
modify_font                     strikethrough_position 120%
modify_font                     strikethrough_thickness 250%
modify_font                     underline_position 125%
modify_font                     underline_thickness 2px
modify_font                     cell_height 105%
undercurl_style                 thin-dense

# disable ligatures when the cursor is over them so they are easier to edit
disable_ligatures               cursor

# cursor
cursor                          none
cursor_stop_blinking_after      10.0
pointer_shape_when_dragging     hand

# bell
enable_audio_bell               yes
visual_bell_duration            0.1

# window
remember_window_size            no
initial_window_width            1200
initial_window_height           720
window_padding_width            2.0
confirm_os_window_close         0
hide_window_decorations         titlebar-only

# scrollback
scrollback_lines                10000

# urls — url_color is set per theme; style makes them visually distinct
url_style                       single

# double-click word selection includes shell-relevant characters (paths, URLs)
select_by_word_characters       @-./_~?&=%+#

# macOS
macos_option_as_alt             left
macos_quit_when_last_window_closed yes
macos_show_window_title_in      none
macos_custom_beam_cursor        yes

# keys
kitty_mod                       cmd
map kitty_mod+n                 new_os_window_with_cwd

# term — xterm-kitty enables full kitty protocol (undercurl, extended mouse, image)
term                            xterm-kitty

# allow programs to read/write the clipboard
clipboard_control               write-clipboard write-primary

# sync screen updates to the monitor refresh rate
sync_to_monitor                 yes
