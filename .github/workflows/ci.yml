name: CI

on:
  push:
    branches: [master, mise-bootstrap-migration]
  pull_request:
  workflow_dispatch:

jobs:
  bootstrap:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64
            runner: ubuntu-latest
            full: true
          - name: Ubuntu arm64
            runner: ubuntu-24.04-arm
            full: true
          # macOS: tools + dotfiles only. A full bootstrap would install GUI
          # casks, need mas/Apple-ID sign-in, write system defaults and chsh -
          # impractical on a runner. This still exercises the aqua tools and the
          # symlink layer on macOS.
          - name: macOS arm64
            runner: macos-latest
            full: false
    env:
      CI: "true"                     # tasks/login-shell.fish self-skips
      MISE_SKIP_LOGIN_SHELL: "1"
      GITHUB_TOKEN: ${{ github.token }}  # linux-extras font fetch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise and expose ~/.dotfiles
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/.dotfiles"

      - name: Validate config parses
        run: |
          cd ~/.dotfiles
          mise trust
          mise config ls
          mise tasks
          mise bootstrap status || true

      - name: Dry-run bootstrap
        run: |
          cd ~/.dotfiles
          mise bootstrap --dry-run

      - name: Provision (full bootstrap)
        if: matrix.full
        run: |
          cd ~/.dotfiles
          mise bootstrap --yes

      - name: Provision (tools + dotfiles only)
        if: ${{ !matrix.full }}
        run: |
          cd ~/.dotfiles
          mise bootstrap --only tools,dotfiles --yes

      - name: Verify key binaries resolve
        run: |
          cd ~/.dotfiles
          set -euo pipefail
          for t in nvim delta eza dust lazygit k9s zellij shfmt \
                   atuin tealdeer starship fd bat rg fzf gh jq gum; do
            echo "== $t =="
            version=$(mise exec -- "$t" --version 2>&1) \
              || { echo "MISSING or broken: $t: $version"; exit 1; }
            echo "${version%%$'\n'*}"
          done
          if [ "${{ matrix.full }}" = "true" ]; then
            btop --version
          fi

      - name: Shell startup smoke test
        if: matrix.full
        run: |
          out=$(mise exec -- fish -ic 'echo __OK__' 2>&1) \
            || { printf '%s\n' "$out"; echo "fish failed to start"; exit 1; }
          printf '%s\n' "$out"
          echo "$out" | grep -q __OK__ \
            || { echo "fish did not start cleanly"; exit 1; }
          if echo "$out" | grep -qi 'command not found'; then
            echo "shell startup printed command-not-found"; exit 1
          fi
          echo "shell startup clean"

      - name: Validate changed files with repository hooks
        if: matrix.name == 'Ubuntu x86_64'
        env:
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cd ~/.dotfiles
          base="$BASE_SHA"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          mise exec -- prek run --from-ref "$base" --to-ref HEAD
