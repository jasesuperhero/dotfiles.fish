palette = "catppuccin_latte"

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

[character]
# Note the use of Catppuccin color 'maroon'
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"

[aws]
style = 'bold blue'
symbol = '🅰 '

[cmake]
disabled = true

[cmd_duration]
style = "yellow dimmed"
format = "[$duration]($style) "
min_time = 500

[conda]
disabled = true

[crystal]
disabled = true

[dart]
disabled = true

[directory]
read_only = " "
truncate_to_repo = true
style = "bold green"

[docker_context]
disabled = true

[dotnet]
disabled = true

[elixir]
disabled = true

[elm]
disabled = true

[erlang]
disabled = true

[gcloud]
disabled = true

[git_branch]
symbol = " "

[git_status]
format = "[$ahead_behind$untracked$modified]($style)"

[git_metrics]
disabled = true
added_style = 'bold green'
deleted_style = "bold red"
format = '[ $added]($added_style) [ $deleted]($deleted_style) '

